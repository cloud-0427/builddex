plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

def jitPackGroup = System.getenv('GROUP')
def jitPackArtifact = System.getenv('ARTIFACT')
def centralGroup = providers.gradleProperty('central.group').getOrElse('io.github.cloud-0427')

group = jitPackGroup && jitPackArtifact
        ? "${jitPackGroup}.${jitPackArtifact}"
        : centralGroup
version = System.getenv('VERSION') ?: '0.1.24'

android {
    namespace = 'io.github.xjc.jiagu.local'
    compileSdk = 36
    defaultConfig {
        minSdk = 29
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    publishing { singleVariant('release') { withSourcesJar() } }
}


def releaseJavadocJar = tasks.register('releaseJavadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from(rootProject.file('../README.md'))
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'jiagu-local-runtime'
                artifact releaseJavadocJar
                pom {
                    name = 'BuildDex Jiagu Local Runtime'
                    description = 'Public-API local encrypted DEX loader and asynchronous event runtime.'
                    url = 'https://github.com/cloud-0427/builddex'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'cloud-0427'
                            name = 'Cloud-0427'
                            url = 'https://github.com/cloud-0427'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/cloud-0427/builddex.git'
                        developerConnection = 'scm:git:ssh://github.com/cloud-0427/builddex.git'
                        url = 'https://github.com/cloud-0427/builddex'
                    }
                }
            }
        }
    }
}

def signingKey = providers.gradleProperty('signingInMemoryKey')
        .orElse(providers.environmentVariable('SIGNING_IN_MEMORY_KEY')).orNull
def signingPassword = providers.gradleProperty('signingInMemoryKeyPassword')
        .orElse(providers.environmentVariable('SIGNING_IN_MEMORY_KEY_PASSWORD')).orNull
def localGpgExecutable = rootProject.file('C:/Program Files/GnuPG/bin/gpg.exe')
def gpgExecutableForSigning = providers.gradleProperty('signing.gnupg.executable')
        .orElse(providers.environmentVariable('SIGNING_GNUPG_EXECUTABLE'))
        .orElse(localGpgExecutable.isFile() ? localGpgExecutable.absolutePath : '')
        .get()
if (!findProperty('signing.gnupg.executable') && gpgExecutableForSigning) {
    ext.set('signing.gnupg.executable', gpgExecutableForSigning)
}
def isSonatypePublication = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains('sonatype')
}
signing {
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    } else {
        // Keep the private key in the user's GnuPG keyring.  Gradle reads
        // signing.gnupg.* properties (including executable/keyName) from the
        // user Gradle home, rather than from this tracked project.
        useGpgCmd()
    }
    required { isSonatypePublication }
    sign publishing.publications
}

// JitPack builds `publishToMavenLocal` without the private key used for Central.
// The signing plugin still wires its sign task into local publication, so skip it
// unless this invocation publishes to Sonatype.
tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
    onlyIf { isSonatypePublication }
}

dependencies {
    compileOnly 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
