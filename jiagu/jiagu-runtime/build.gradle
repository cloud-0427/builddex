plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def jitPackGroup = System.getenv('GROUP')
def jitPackArtifact = System.getenv('ARTIFACT')

group = jitPackGroup && jitPackArtifact
        ? "${jitPackGroup}.${jitPackArtifact}"
        : 'io.github.xjc'
version = System.getenv('VERSION') ?: '0.1.4'

android {
    namespace 'io.github.xjc.jiagu'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdk 29
        targetSdk 36
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++2a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'jiagu-runtime'
            }
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.google.android.play:integrity:1.6.0'
    // Android only guarantees the platform Ed25519 provider from API 33.
    // Tink supplies a verified implementation for the runtime's minSdk 29.
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    testImplementation libs.junit
}
