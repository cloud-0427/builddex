plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

def jitPackGroup = System.getenv('GROUP')
def jitPackArtifact = System.getenv('ARTIFACT')
def centralGroup = providers.gradleProperty('central.group').getOrElse('io.github.cloud-0427')
def publicationGroup = jitPackGroup && jitPackArtifact
        ? "${jitPackGroup}.${jitPackArtifact}"
        : centralGroup
def publicationVersion = System.getenv('VERSION') ?: '0.1.20'

// 本地开发使用固定坐标；JitPack 构建时使用其注入的 GitHub 坐标和 Tag。
group = publicationGroup
version = publicationVersion

def centralUsername = providers.gradleProperty('centralUsername')
        .orElse(providers.environmentVariable('CENTRAL_USERNAME')).orNull
def centralPassword = providers.gradleProperty('centralPassword')
        .orElse(providers.environmentVariable('CENTRAL_PASSWORD')).orNull

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
            username = centralUsername
            password = centralPassword
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Compile against the oldest supported Android Components API. AGP 8.12 requires
    // Gradle 8.13, while this API remains binary-compatible with the AGP 9.x line.
    compileOnly 'com.android.tools.build:gradle-api:8.12.2'
    // Keep Jiagu's standalone R8/D8 ahead of AGP 8.12's toolchain and compatible
    // with Kotlin 2.3 class metadata (R8 8.13.19+).
    implementation 'com.android.tools:r8:8.13.23'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

// 强制 Gradle 允许在 Java 8 项目中使用更高版本的 AGP 依赖进行编译
configurations.compileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The plugin exposes Gradle task implementation classes as public JVM classes, but they are not
// supported user-facing API. Keep validating actual Javadoc syntax while suppressing doclint's
// exhaustive "missing comment/@return" checks for those implementation details.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

/**
 * 解决 "Cannot resolve resource filtering of MatchingCopyAction" 警告。
 * IDEA 的 JPS 构建器无法处理 processResources 任务中的 filesMatching 或 filter 闭包。
 * 解决方案：将文件生成逻辑独立到自定义任务，并将其输出目录添加到资源集中。
 */
def generateJiaguProperties = tasks.register('generateJiaguProperties') {
    def outputDir = layout.buildDirectory.dir("generated/jiagu-resources")
    def propertiesFile = outputDir.map { it.file("jiagu-publication.properties") }

    outputs.dir(outputDir)
    inputs.property('runtimeGroup', publicationGroup)
    inputs.property('runtimeVersion', publicationVersion)

    doLast {
        def file = propertiesFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """runtime.group=${publicationGroup}
runtime.artifact=jiagu-runtime
runtime.version=${publicationVersion}
"""
    }
}

sourceSets.main.resources.srcDir(generateJiaguProperties)

gradlePlugin {
    plugins {
        dexReport {
            id = 'io.github.xjc.dex-report'
            implementationClass = 'io.github.xjc.dexreport.DexReportPlugin'
            displayName = 'Android DEX Report Plugin'
            description = 'Reports intermediate and packaged DEX files for Android variants.'
        }
    }
}

def configureCentralPom = { pom ->
    pom.name = 'BuildDex Jiagu Gradle Plugin'
    pom.description = 'Android APK protection Gradle plugin with shell/business DEX separation.'
    pom.url = 'https://github.com/cloud-0427/builddex'
    pom.licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            distribution = 'repo'
        }
    }
    pom.developers {
        developer {
            id = 'cloud-0427'
            name = 'Cloud-0427'
            url = 'https://github.com/cloud-0427'
        }
    }
    pom.scm {
        connection = 'scm:git:git://github.com/cloud-0427/builddex.git'
        developerConnection = 'scm:git:ssh://github.com/cloud-0427/builddex.git'
        url = 'https://github.com/cloud-0427/builddex'
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        // The actual plugin module is published under the verified namespace.
        // The legacy plugin ID is resolved to this module in settings.gradle.
        groupId = publicationGroup
        configureCentralPom(pom)
    }
}

// Gradle plugin markers use the plugin ID as their groupId.  The legacy ID
// `io.github.xjc.dex-report` is outside this project's verified Central
// namespace (`io.github.cloud-0427`), so Central rejects that marker.  Publish
// the consumable plugin module instead; consumers resolve the legacy ID with
// pluginManagement { resolutionStrategy { useModule(...) } }.
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    onlyIf {
        !(publication.name == 'dexReportPluginMarkerMaven' && repository.name == 'sonatype')
    }
}

def signingKey = providers.gradleProperty('signingInMemoryKey')
        .orElse(providers.environmentVariable('SIGNING_IN_MEMORY_KEY')).orNull
def signingPassword = providers.gradleProperty('signingInMemoryKeyPassword')
        .orElse(providers.environmentVariable('SIGNING_IN_MEMORY_KEY_PASSWORD')).orNull
def localGpgExecutable = rootProject.file('C:/Program Files/GnuPG/bin/gpg.exe')
def gpgExecutableForSigning = providers.gradleProperty('signing.gnupg.executable')
        .orElse(providers.environmentVariable('SIGNING_GNUPG_EXECUTABLE'))
        .orElse(localGpgExecutable.isFile() ? localGpgExecutable.absolutePath : '')
        .get()
if (!findProperty('signing.gnupg.executable') && gpgExecutableForSigning) {
    ext.set('signing.gnupg.executable', gpgExecutableForSigning)
}
signing {
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    } else {
        // Keep the private key in the user's GnuPG keyring.  Gradle reads
        // signing.gnupg.* properties (including executable/keyName) from the
        // user Gradle home, rather than from this tracked project.
        useGpgCmd()
    }
    required {
        gradle.taskGraph.allTasks.any { task ->
            task.name.toLowerCase(Locale.ROOT).contains('sonatype')
        }
    }
    sign publishing.publications
}
