plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

def jitPackGroup = System.getenv('GROUP')
def jitPackArtifact = System.getenv('ARTIFACT')
def publicationGroup = jitPackGroup && jitPackArtifact
        ? "${jitPackGroup}.${jitPackArtifact}"
        : 'io.github.xjc'
def publicationVersion = System.getenv('VERSION') ?: '0.1.0'

// 本地开发使用固定坐标；JitPack 构建时使用其注入的 GitHub 坐标和 Tag。
group = publicationGroup
version = publicationVersion

repositories {
    google()
    mavenCentral()
}

dependencies {
    compileOnly 'com.android.tools.build:gradle-api:9.3.1'
    implementation 'com.android.tools:r8:8.3.37' // Use a version compatible with AGP 9.3.1 if possible, but 8.3.x is common
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

// 强制 Gradle 允许在 Java 8 项目中使用更高版本的 AGP 依赖进行编译
configurations.compileClasspath {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    filesMatching('jiagu-publication.properties') {
        expand(
                runtimeGroup: publicationGroup,
                runtimeVersion: publicationVersion
        )
    }
}

gradlePlugin {
    plugins {
        dexReport {
            id = 'io.github.xjc.dex-report'
            implementationClass = 'io.github.xjc.dexreport.DexReportPlugin'
            displayName = 'Android DEX Report Plugin'
            description = 'Reports intermediate and packaged DEX files for Android variants.'
        }
    }
}
