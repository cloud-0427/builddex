plugins {
    alias(libs.plugins.android.application)
    // 插件来源和版本统一由 settings.gradle 中的 jiagu.source/jiagu.version 控制。
    id 'io.github.xjc.dex-report'
}

// app/build.gradle
dexReport {
    // 指定在哪些构建类型下自动运行。支持 "debug", "release" 等。
    autoRunBuildTypes = ["debug","release"]

    // 指定挂载的任务前缀。
    // 支持 "assemble" (默认), "bundle" (生成AAB), "install" (安装) 等。
    attachToTask = "assemble"

    // test
    serverUrl = "http://192.168.111.115:8761"
    companyApiKey = "X9sRFtwGOndFhS1ykVq2EIVP-JoDk728w3tQxvIkR6o"

    // online
    companyId = "acme"
//    companyApiKey = "xxoPvVsSoYgl-DIrxIeuM7phh2gTihwtMMpqesuIRvQ"

    // 加固密钥是否发布，发布后此版本不能再修改
    publish = true
    // debug 检测，测试关闭，线上可以打开，默认是打开的
    antiDebugEnabled = true

    // 是否混淆res， unity 目前不支持，需要增加 res 白名单，后续添加
    resObfuscationEnabled = true

    // 只保留 中文 和 英文
    resConfigs = ["zh", "en"]

    buildTypes {
        release {
            publish = true
            antiDebugEnabled = true
        }
        debug {
            // 这里可以单独覆盖 debug 的行为
            publish = false
            antiDebugEnabled = false
        }
    }
}

android {
    namespace 'lows.dgeon.ightr.jiagu'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "lows.dgeon.ightr.jiagu"
        minSdk 29
        targetSdk 36
        versionCode 16
        versionName "1.0.16"

        multiDexEnabled false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++2a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            
            // AGP 9.3+ 正确的禁用方式：在 installation 块中设置
            installation {
                enableBaselineProfile = false
            }

            experimentalProperties["android.experimental.r8.dex-startup-optimization"] = false
            experimentalProperties["android.experimental.art-profile-r8-rewriting"] = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'src/main/keepRules/rules.keep'
            signingConfig signingConfigs.debug
        }
        debug {
            installation {
                enableBaselineProfile = false
            }
            experimentalProperties["android.experimental.r8.dex-startup-optimization"] = false
            experimentalProperties["android.experimental.art-profile-r8-rewriting"] = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // jiagu-runtime 由加固插件自动注入：local 模式使用本地 project，
    // jitpack 模式使用与插件相同版本的远程 AAR。不要在这里重复声明。
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.androidx.core.splashscreen
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}

configurations {
    all {
        exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
    }
}
