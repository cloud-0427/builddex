plugins {
    alias(libs.plugins.android.application)
    id 'io.github.xjc.dex-report' version '0.1.0'
}

// app/build.gradle
dexReport {
    // 指定在哪些构建类型下自动运行。支持 "debug", "release" 等。
    autoRunBuildTypes = ["debug","release"]

    // 指定挂载的任务前缀。
    // 支持 "assemble" (默认), "bundle" (生成AAB), "install" (安装) 等。
    attachToTask = "assemble"
    
    // 设置加固加密使用的 AES 密钥
    aesKey = "MY_SECURE_AES_KEY"
}

android {
    namespace 'lows.dgeon.ightr.jiagu'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "lows.dgeon.ightr.jiagu"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++2a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'src/main/keepRules/rules.keep'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':jiagu-runtime')
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
