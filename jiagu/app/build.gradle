plugins {
    alias(libs.plugins.android.application)
    // 插件来源和版本统一由 settings.gradle 中的 jiagu.source/jiagu.version 控制。
    id 'io.github.xjc.dex-report'
}

// app/build.gradle
dexReport {
    protectionMode = "local"
    payloadSelectionMode = "allowlist"
    payloadIncludePackages = ["lows.dgeon.ightr.jiagu.**"]
    payloadR8Policy = "fail"
    shellMinificationEnabled = true
    autoRunBuildTypes = ["debug", "release"]
    startupTelemetryEnabled = providers.gradleProperty("jiagu.telemetry").getOrElse("false").toBoolean()
    startupLogUploaderClass = providers.gradleProperty("jiagu.uploader")
            .getOrElse("lows.dgeon.ightr.jiagu.StartupEventUploader")
    resObfuscationEnabled = false
}

android {
    // Opt in to testing the actual minified/protected release APK.
    testBuildType = providers.gradleProperty('jiagu.testBuildType').getOrElse('debug')
    namespace = 'lows.dgeon.ightr.jiagu'
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "lows.dgeon.ightr.jiagu"
        minSdk = 29
        targetSdk = 36
        versionCode 24
        versionName "1.0.24"

        multiDexEnabled = false

        testInstrumentationRunner providers.gradleProperty('jiagu.testRunner')
                .getOrElse('lows.dgeon.ightr.jiagu.LocalMvpInstrumentation')

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++2a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false // local mode runs isolated Runtime R8 before AGP's D8 pass.
            shrinkResources = false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'src/main/keepRules/rules.keep'
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
    buildFeatures {
        viewBinding = true
    }
}

base {
    def date = new Date().format("yyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
    archivesName = "${project.name}_${date}_${android.defaultConfig.versionName}"
}

dependencies {



    // jiagu-runtime 由加固插件自动注入：local 模式使用本地 project，
    // jitpack 模式使用与插件相同版本的远程 AAR。不要在这里重复声明。
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.core
    implementation libs.androidx.lifecycle.runtime
    // Keep the legacy ViewPager and coroutine artifacts off their old transitive versions.
    implementation libs.androidx.viewpager
    implementation libs.kotlinx.coroutines.android
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
