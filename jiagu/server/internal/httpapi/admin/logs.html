<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Jiagu · 打包与下发统计</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="logs.css">
</head>
<body>
  <div class="shell standalone">
    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow"><a href="/admin/" id="backLink">管理后台</a> / 统计查询</p>
          <h1 id="pageTitle">打包与下发历史</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="refreshButton" type="button" title="刷新">↻</button>
          <button class="user-chip" id="authInfo" type="button"><span>?</span>未连接</button>
        </div>
      </header>

      <section class="content">
        <div class="intro">
          <div><h2 id="companyIdDisplay">—</h2><p id="companyDescDisplay">请先完成身份验证以查看统计数据。</p></div>
        </div>

        <section class="table-card">
          <div class="table-wrap" id="logsContainer">
            <!-- Grouped tables will be rendered here -->
          </div>
          <div class="table-state" id="logsState">
            <span class="spinner"></span>
            <p>正在读取统计信息…</p>
          </div>
          <footer class="table-footer">
            <span id="logsCount">共 0 条记录</span>
            <div class="pagination" id="logsPagination"></div>
          </footer>
        </section>
      </section>
    </main>
  </div>

  <dialog class="compact-dialog" id="loginDialog">
    <form id="loginForm">
      <div class="token-symbol">⌁</div>
      <h2>查询验证</h2>
      <p>请输入管理员 Token 或公司 API Key 以访问统计数据。</p>
      <label class="field">
        <span>公司 ID</span>
        <input name="companyId" id="companyIdInput" required placeholder="例如 acme_android">
      </label>
      <label class="field">
        <span>管理员 Token 或 API Key</span>
        <input name="key" type="password" required placeholder="输入 Token 或 Key">
      </label>
      <p class="form-error" id="loginError"></p>
      <button class="primary-button full-button" type="submit">开始查询</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="logs.js" defer></script>
</body>
</html>
