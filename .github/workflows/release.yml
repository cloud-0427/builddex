name: Publish GitHub release and JitPack artifacts

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUP: com.github.cloud-0427
      ARTIFACT: builddex
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x jiagu/gradlew

      - name: Verify runtime publication
        working-directory: jiagu
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew clean :jiagu-runtime:publishToMavenLocal -x test

      - name: Verify plugin publication
        working-directory: jiagu
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew -p dex-report-plugin clean publishToMavenLocal -x test

      - name: Publish runtime to Maven Central
        working-directory: jiagu
        env:
          # JitPack coordinates are set at the job level; clear them so this
          # publication uses the verified io.github.cloud-0427 namespace.
          GROUP: ''
          ARTIFACT: ''
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :jiagu-runtime:publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Publish Gradle plugin to Maven Central
        working-directory: jiagu
        env:
          # See runtime publication above.
          GROUP: ''
          ARTIFACT: ''
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew -p dex-report-plugin publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Trigger and verify JitPack build
        shell: bash
        run: |
          build_log="${RUNNER_TEMP}/jitpack-build.log"
          curl --fail --location --retry 2 --max-time 1200 \
            "https://jitpack.io/com/github/cloud-0427/builddex/${VERSION}/build.log" \
            --output "${build_log}"
          cat "${build_log}"
          grep -q "BUILD SUCCESSFUL" "${build_log}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --verify-tag --generate-notes --title "${VERSION}"
